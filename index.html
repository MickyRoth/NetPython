<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetPython - Python Online Compiler & Interpreter</title>

  <!-- CodeMirror CSS & Themes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/mark-selection.min.css">

  <!-- CodeMirror Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>

  <!-- Pyodide (Full CPython WebAssembly Runtime) -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>

  <style>
    :root {
      --bg-darker: #0d1117;
      --bg-topbar: #141824;
      --bg-sidebar: #11151f;
      --bg-editor: #161b27;
      --bg-output: #0f131c;
      --bg-tab-active: #161b27;
      --bg-tab-inactive: #11151f;
      --border-color: #21293a;
      --border-light: #2c364c;
      --primary-blue: #2563eb;
      --primary-blue-hover: #1d4ed8;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --font-code: "Fira Code", "Cascadia Code", "Consolas", "Courier New", monospace;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-darker);
      color: var(--text-white);
      font-family: var(--font-ui);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ==========================================================================
       TOPBAR
       ========================================================================== */
    .topbar {
      height: 52px;
      background-color: var(--bg-topbar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand-section {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1px;
    }

    .brand-logo-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-logo-text {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #ffffff;
      display: flex;
      align-items: baseline;
    }

    .brand-logo-text span.brand-dot {
      color: #3b82f6;
    }

    .brand-subtitle {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      border-radius: 20px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-amber);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .status-dot.ready {
      background-color: var(--accent-green);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    .status-dot.running {
      background-color: var(--primary-blue);
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.8);
      animation: pulse 1.2s infinite;
    }

    .status-dot.error {
      background-color: var(--accent-red);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.7);
    }

    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }

    .shortcut-hint {
      font-size: 11.5px;
      color: var(--text-dim);
      display: none;
    }

    @media (min-width: 860px) {
      .shortcut-hint { display: inline-block; }
    }

    .kbd {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10.5px;
      color: var(--text-muted);
      font-family: inherit;
    }

    /* ==========================================================================
       MAIN LAYOUT (WORKSPACE)
       ========================================================================== */
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 52px);
      overflow: hidden;
      position: relative;
    }

    /* Workspace Split */
    .workspace {
      display: flex;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    /* ==========================================================================
       EDITOR PANE (LEFT)
       ========================================================================== */
    .editor-pane {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 50%;
      min-width: 280px;
      background-color: var(--bg-editor);
      position: relative;
      overflow: hidden;
    }

    .pane-toolbar {
      height: 44px;
      background-color: var(--bg-tab-inactive);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      flex-shrink: 0;
      gap: 8px;
    }

    .editor-tabs {
      display: flex;
      align-items: center;
      height: 100%;
      gap: 2px;
    }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 38px;
      padding: 0 14px;
      background-color: var(--bg-tab-active);
      border-radius: 6px 6px 0 0;
      border: 1px solid var(--border-color);
      border-bottom: none;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-white);
      position: relative;
      top: 3px;
    }

    .tab-python-icon {
      width: 15px;
      height: 15px;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Standard Button Styling */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      font-size: 12.5px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
      border: 1px solid transparent;
      user-select: none;
      white-space: nowrap;
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-white);
      border-color: var(--border-color);
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.1);
      border-color: var(--border-light);
    }

    .btn-secondary:active {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .btn-primary-run {
      background-color: var(--primary-blue);
      color: #ffffff;
      font-weight: 600;
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }

    .btn-primary-run:hover {
      background-color: var(--primary-blue-hover);
      box-shadow: 0 3px 12px rgba(37, 99, 235, 0.5);
      transform: translateY(-0.5px);
    }

    .btn-primary-run:active {
      transform: translateY(0.5px);
      box-shadow: 0 1px 4px rgba(37, 99, 235, 0.4);
    }

    .btn-primary-run:disabled {
      background-color: #334155;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Example selector dropdown */
    .example-select {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-white);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    .example-select option {
      background-color: #1e2433;
      color: #fff;
    }

    .editor-wrapper {
      flex: 1;
      height: calc(100% - 44px);
      position: relative;
    }

    .CodeMirror {
      height: 100% !important;
      font-family: var(--font-code);
      font-size: 13.5px;
      line-height: 1.55;
      background-color: var(--bg-editor) !important;
    }

    .CodeMirror-gutters {
      background-color: #131722 !important;
      border-right: 1px solid var(--border-color) !important;
    }

    .CodeMirror-linenumber {
      color: #4b5563 !important;
      padding: 0 8px 0 4px !important;
    }

    .CodeMirror-activeline-background {
      background: rgba(255, 255, 255, 0.03) !important;
    }

    /* ==========================================================================
       RESIZER (DIVIDER)
       ========================================================================== */
    .resizer {
      width: 9px;
      cursor: col-resize;
      background-color: var(--bg-darker);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
      z-index: 10;
      flex-shrink: 0;
    }

    .resizer:hover, .resizer.dragging {
      background-color: var(--primary-blue);
      border-color: var(--primary-blue);
    }

    .resizer-handle {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 8px 2px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    .resizer:hover .resizer-handle,
    .resizer.dragging .resizer-handle {
      background: rgba(255, 255, 255, 0.25);
    }

    .resizer-dot {
      width: 3px;
      height: 3px;
      background-color: var(--text-muted);
      border-radius: 50%;
    }

    .resizer:hover .resizer-dot,
    .resizer.dragging .resizer-dot {
      background-color: #ffffff;
    }

    /* ==========================================================================
       OUTPUT PANE (RIGHT)
       ========================================================================== */
    .output-pane {
      display: flex;
      flex-direction: column;
      height: 100%;
      flex: 1;
      min-width: 250px;
      background-color: var(--bg-output);
      position: relative;
      overflow: hidden;
    }

    .output-header {
      height: 44px;
      background-color: var(--bg-tab-inactive);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      flex-shrink: 0;
    }

    .output-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .output-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-white);
    }

    .exec-time {
      font-size: 11px;
      color: var(--text-dim);
      background: rgba(255,255,255,0.04);
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .output-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-white);
      border-color: var(--border-color);
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .terminal-body {
      flex: 1;
      padding: 14px 16px;
      overflow-y: auto;
      font-family: var(--font-code);
      font-size: 13px;
      line-height: 1.6;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
    }

    .terminal-body::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .terminal-body::-webkit-scrollbar-thumb {
      background: #252e42;
      border-radius: 4px;
    }

    .terminal-body::-webkit-scrollbar-thumb:hover {
      background: #33405c;
    }

    .terminal-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .out-stdout {
      color: #f1f5f9;
    }

    .out-stderr {
      color: #f87171;
      font-weight: 500;
    }

    .out-info {
      color: #38bdf8;
      font-style: italic;
    }

    .out-input-echo {
      color: #34d399;
      font-weight: 600;
    }

    .out-system {
      color: #64748b;
      border-top: 1px dashed #21293a;
      margin-top: 8px;
      padding-top: 6px;
      font-size: 11.5px;
    }

    .placeholder-msg {
      color: #475569;
      font-style: italic;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 80%;
      gap: 10px;
      text-align: center;
      user-select: none;
    }

    .placeholder-msg svg {
      width: 44px;
      height: 44px;
      fill: #334155;
    }

    /* Notification Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1e293b;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-light);
      font-size: 13px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 1000;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==========================================================================
       MODAL DIALOG (SAVE AS)
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: #1a202c;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      width: 440px;
      max-width: 90vw;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      transform: translateY(-10px);
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-header {
      padding: 14px 18px;
      background-color: #141824;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-white);
    }

    .modal-title svg {
      width: 16px;
      height: 16px;
      fill: var(--primary-blue);
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s ease;
    }

    .modal-close-btn:hover {
      color: var(--text-white);
      background: rgba(255, 255, 255, 0.1);
    }

    .modal-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-label {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .modal-input {
      width: 100%;
      background-color: #11151f;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-white);
      font-family: var(--font-code);
      font-size: 13.5px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .modal-input:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }

    .modal-hint {
      font-size: 11.5px;
      color: var(--text-dim);
    }

    .modal-hint code {
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .modal-footer {
      padding: 12px 18px;
      background-color: #141824;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

  <!-- ================= TOPBAR ================= -->
  <header class="topbar">
    <div class="brand-section">
      <div class="brand-logo-row">
        <svg style="width: 22px; height: 22px; margin-right: 4px;" viewBox="0 0 24 24">
          <path fill="#38bdf8" d="M12 0C5.7 0 6 2.7 6 2.7l.01 2.8H12v.8H3.7S0 5.8 0 12c0 6.2 3.3 6 3.3 6h1.9v-2.7s-.1-3.3 3.2-3.3h5.5v-.8H8.4s-2.8.1-2.8-2.7c0-2.8 2.5-2.7 2.5-2.7h9.3s2.6 0 2.6-2.6C20 2.7 18.2 0 12 0z"/>
          <path fill="#facc15" d="M12 24c6.3 0 6-2.7 6-2.7l-.01-2.8H12v-.8h8.3s3.7.5 3.7-5.7c0-6.2-3.3-6-3.3-6h-1.9v2.7s.1 3.3-3.2 3.3H9.6v.8h5.5s2.8-.1 2.8 2.7c0 2.8-2.5 2.7-2.5 2.7H8.6s-2.6 0-2.6 2.6C6 21.3 7.8 24 12 24z"/>
        </svg>
        <div class="brand-logo-text">
          NetPython<span class="brand-dot">.</span>
        </div>
      </div>
      <div class="brand-subtitle">Python Online Compiler &amp; Interpreter</div>
    </div>

    <div class="topbar-right">
      <span class="shortcut-hint">Ausführen mit <kbd class="kbd">Ctrl</kbd> + <kbd class="kbd">Enter</kbd></span>
      <div class="status-badge" id="statusBadge">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Lade Python Engine...</span>
      </div>
    </div>
  </header>

  <!-- ================= MAIN LAYOUT ================= -->
  <div class="main-container">
    
    <!-- WORKSPACE (EDITOR + RESIZER + OUTPUT) -->
    <main class="workspace" id="workspace">

      <!-- ================= LEFT: EDITOR PANE ================= -->
      <section class="editor-pane" id="editorPane">
        
        <!-- Toolbar above editor -->
        <div class="pane-toolbar">
          <div class="editor-tabs">
            <div class="tab-item">
              <svg class="tab-python-icon" viewBox="0 0 24 24">
                <path fill="#38bdf8" d="M12 0C5.7 0 6 2.7 6 2.7l.01 2.8H12v.8H3.7S0 5.8 0 12c0 6.2 3.3 6 3.3 6h1.9v-2.7s-.1-3.3 3.2-3.3h5.5v-.8H8.4s-2.8.1-2.8-2.7c0-2.8 2.5-2.7 2.5-2.7h9.3s2.6 0 2.6-2.6C20 2.7 18.2 0 12 0z"/>
                <path fill="#facc15" d="M12 24c6.3 0 6-2.7 6-2.7l-.01-2.8H12v-.8h8.3s3.7.5 3.7-5.7c0-6.2-3.3-6-3.3-6h-1.9v2.7s.1 3.3-3.2 3.3H9.6v.8h5.5s2.8-.1 2.8 2.7c0 2.8-2.5 2.7-2.5 2.7H8.6s-2.6 0-2.6 2.6C6 21.3 7.8 24 12 24z"/>
              </svg>
              <span id="tabFilename">main.py</span>
            </div>
          </div>

          <div class="toolbar-actions">
            <!-- Neu Button -->
            <button class="btn btn-secondary" id="btnNew" title="Neues Dokument erstellen">
              <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
              <span>Neu</span>
            </button>

            <!-- Öffnen Button -->
            <button class="btn btn-secondary" id="btnOpen" title="Python Datei (.py) von Festplatte laden">
              <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
              <span>Öffnen</span>
            </button>
            <input type="file" id="fileInput" accept=".py,.txt" style="display: none;">

            <!-- Speichern Button -->
            <button class="btn btn-secondary" id="btnSave" title="Aktuellen Code als .py Datei speichern">

  <script>
    // Minimales Startprogramm
    const DEFAULT_CODE = `# Online Python Interpreter (NetPython)

    const EXAMPLES = {

      statistics: `# Demonstration des Moduls 'statistics'

      input: `# Demonstration von Benutzereingaben mit input()

    };

    // Global State
    let pyodideInstance = null;
    let isPyodideReady = false;
    let isExecuting = false;
    let currentFilename = "main.py";
    let editor = null;

    // DOM Elements
    const terminal = document.getElementById("terminal");
    const placeholder = document.getElementById("placeholder");
    const btnRun = document.getElementById("btnRun");
    const btnNew = document.getElementById("btnNew");
    const btnOpen = document.getElementById("btnOpen");
    const btnSave = document.getElementById("btnSave");
    const fileInput = document.getElementById("fileInput");
    const btnClearOutput = document.getElementById("btnClearOutput");
    const btnCopyOutput = document.getElementById("btnCopyOutput");
    const btnShare = document.getElementById("btnShare");
    const exampleSelect = document.getElementById("exampleSelect");
    const statusBadge = document.getElementById("statusBadge");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const execTime = document.getElementById("execTime");
    const tabFilename = document.getElementById("tabFilename");
    const toast = document.getElementById("toast");

    // Initialize CodeMirror Editor
    function initEditor() {
      const textarea = document.getElementById("codeTextarea");
      editor = CodeMirror.fromTextArea(textarea, {
        mode: { name: "python", version: 3, singleLineStringErrors: false },
        theme: "dracula",
        lineNumbers: true,
        matchBrackets: true,
        autoCloseBrackets: true,
        styleActiveLine: true,
        indentUnit: 4,
        tabSize: 4,
        indentWithTabs: false,
        extraKeys: {
          "Tab": function(cm) {
            cm.replaceSelection("    ", "end");
          },
          "Ctrl-Enter": function() {
            runCode();
          },
          "Cmd-Enter": function() {
            runCode();
          },
          "Ctrl-S": function(cm) {
            saveCodeToFile();
          },
          "Cmd-S": function(cm) {
            saveCodeToFile();
          }
        }
      });

      // Load starter code or localStorage code
      const savedCode = localStorage.getItem("netpython_saved_code");
      const isOldExample = savedCode && (savedCode.includes("Kreisberechnung") || savedCode.includes("Zufallswürfe"));
      if (savedCode !== null && !isOldExample) {
        editor.setValue(savedCode);
      } else {
        editor.setValue(DEFAULT_CODE);
      }

      // Auto-save draft on change
      editor.on("change", () => {
        localStorage.setItem("netpython_saved_code", editor.getValue());
      });
    }

    // Toast Notifications
    let toastTimeout;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    // Terminal Output Helpers
    function clearTerminal() {
      terminal.innerHTML = "";
    }

    function appendOutput(text, type = "stdout") {
      if (placeholder && placeholder.parentNode === terminal) {
        placeholder.remove();
      }
      const span = document.createElement("span");
      span.className = `out-${type}`;
      span.textContent = text;
      terminal.appendChild(span);
      terminal.scrollTop = terminal.scrollHeight;
    }

    // Prompt Handler for Python input()
    window.promptPythonInput = function(promptText) {
      const result = window.prompt(promptText || "Python input():");
      return result;
    };

    // Initialize Pyodide Runtime
    async function initPyodide() {
      btnRun.disabled = true;
      statusDot.className = "status-dot running";
      statusText.textContent = "Lade Python...";

      try {
        pyodideInstance = await loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"
        });

        // Initialize standard packages and stdout/stderr hooks
        await pyodideInstance.runPythonAsync(`
import sys
import builtins
import js

# Monkey-patch input() to trigger friendly JavaScript window.prompt
def _web_input(prompt=""):
    if prompt:
        print(prompt, end="", flush=True)
    val = js.promptPythonInput(str(prompt))
    if val is None:
        raise KeyboardInterrupt("Benutzereingabe abgebrochen.")
    print(val) # echo input in terminal
    return val

builtins.input = _web_input

# Pre-import core requested modules
import math
import random
import statistics
`);

        isPyodideReady = true;
        btnRun.disabled = false;
        statusDot.className = "status-dot ready";
        statusText.textContent = "Python 3.12 bereit";
      } catch (err) {
        console.error("Pyodide Ladefehler:", err);
        statusDot.className = "status-dot error";
        statusText.textContent = "Fehler beim Laden";
        appendOutput("Fehler beim Laden von Pyodide:\\n" + err.message + "\\nBitte Internetverbindung prüfen.\\n", "stderr");
      }
    }

    // Execute Python Code
    async function runCode() {
      if (!isPyodideReady || isExecuting) return;

      const code = editor.getValue();
      if (!code.trim()) {
        showToast("Kein Code zum Ausführen vorhanden.");
        return;
      }

      isExecuting = true;
      btnRun.disabled = true;
      statusDot.className = "status-dot running";
      statusText.textContent = "Wird ausgeführt...";
      execTime.style.display = "inline-block";
      execTime.textContent = "...";

      clearTerminal();

      const startTime = performance.now();

      // Configure stdout and stderr streams
      pyodideInstance.setStdout({
        batched: (msg) => {
          appendOutput(msg + "\n", "stdout");
        }
      });

      pyodideInstance.setStderr({
        batched: (msg) => {
          appendOutput(msg + "\n", "stderr");
        }
      });

      try {
        await pyodideInstance.runPythonAsync(code);
        const duration = ((performance.now() - startTime) / 1000).toFixed(2);
        execTime.textContent = `${duration}s`;
        appendOutput(`\n[Programm beendet in ${duration}s]`, "system");
        statusDot.className = "status-dot ready";
        statusText.textContent = "Python 3.12 bereit";
      } catch (err) {
        const duration = ((performance.now() - startTime) / 1000).toFixed(2);
        execTime.textContent = `${duration}s`;
        appendOutput(`\n${err.message}\n`, "stderr");
        appendOutput(`[Mit Fehlern abgebrochen nach ${duration}s]`, "system");
        statusDot.className = "status-dot error";
        statusText.textContent = "Ausführungsfehler";
      } finally {
        isExecuting = false;
        btnRun.disabled = false;
      }
    }

    // "Neu" (New File)
    function handleNewFile() {
      const current = editor.getValue();
      if (current.trim() && current !== DEFAULT_CODE) {
        const confirmNew = window.confirm("Neues Dokument erstellen? Nicht gespeicherter Code wird überschrieben.");
        if (!confirmNew) return;
      }
      editor.setValue(DEFAULT_CODE);
      currentFilename = "main.py";
      tabFilename.textContent = currentFilename;
      localStorage.removeItem("netpython_saved_code");
      clearTerminal();
      if (placeholder && placeholder.parentNode !== terminal) {
        terminal.appendChild(placeholder);
      }
      execTime.style.display = "none";
      showToast("Neues Dokument erstellt.");
    }

    // "Öffnen" (Open File)
    function handleOpenFile() {
      fileInput.value = "";
      fileInput.click();
    }

    fileInput.addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        editor.setValue(evt.target.result);
        currentFilename = file.name;
        tabFilename.textContent = currentFilename;
        showToast(`"${file.name}" erfolgreich geladen.`);
      };
      reader.onerror = function() {
        showToast("Fehler beim Lesen der Datei.");
      };
      reader.readAsText(file);
    });

    // ==========================================================================
    // DATEIDIALOG BEIM SPEICHERN ("Speichern unter...")
    // ==========================================================================
    const saveModal = document.getElementById("saveModal");
    const saveFilenameInput = document.getElementById("saveFilenameInput");
    const btnCancelSave = document.getElementById("btnCancelSave");
    const btnCancelSaveCross = document.getElementById("btnCancelSaveCross");
    const btnConfirmSave = document.getElementById("btnConfirmSave");

    function openSaveModal() {
      saveFilenameInput.value = currentFilename || "main.py";
      saveModal.classList.add("active");
      setTimeout(() => {
        saveFilenameInput.focus();
        const dotIdx = saveFilenameInput.value.lastIndexOf(".");
        if (dotIdx > 0) {
          saveFilenameInput.setSelectionRange(0, dotIdx);
        } else {
          saveFilenameInput.select();
        }
      }, 50);
    }

    function closeSaveModal() {
      saveModal.classList.remove("active");
    }

    function executeDownload(filename, code) {
      const blob = new Blob([code], { type: "text/x-python;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      currentFilename = filename;
      tabFilename.textContent = currentFilename;
      showToast(`Datei als "${filename}" gespeichert.`);
    }

    function confirmModalSave() {
      let filename = saveFilenameInput.value.trim() || "main.py";
      if (!filename.toLowerCase().endsWith(".py")) {
        filename += ".py";
      }
      closeSaveModal();
      executeDownload(filename, editor.getValue());
    }

    btnCancelSave.addEventListener("click", closeSaveModal);
    btnCancelSaveCross.addEventListener("click", closeSaveModal);
    btnConfirmSave.addEventListener("click", confirmModalSave);

    saveFilenameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        confirmModalSave();
      } else if (e.key === "Escape") {
        e.preventDefault();
        closeSaveModal();
      }
    });

    saveModal.addEventListener("click", (e) => {
      if (e.target === saveModal) {
        closeSaveModal();
      }
    });

    // "Speichern" Button Action: Native Dateidialog wenn unterstützt, sonst Modal-Dialog
    async function saveCodeToFile() {
      const code = editor.getValue();

      // 1. Nativer OS Dateidialog (File System Access API in Chrome, Edge, etc.)
      if (typeof window.showSaveFilePicker === "function") {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: currentFilename || "main.py",
            types: [
              {
                description: "Python-Datei (*.py)",
                accept: { "text/x-python": [".py"] }
              },
              {
                description: "Alle Dateien (*.*)",
                accept: { "*/*": [".*"] }
              }
            ]
          });

          const writable = await handle.createWritable();
          await writable.write(code);
          await writable.close();

          currentFilename = handle.name;
          tabFilename.textContent = currentFilename;
          showToast(`Datei als "${handle.name}" gespeichert.`);
          return;
        } catch (err) {
          if (err.name === "AbortError") {
            // Benutzer hat den Speichern-Dialog abgebrochen
            return;
          }
          console.warn("Nativer showSaveFilePicker nicht verfügbar, öffne Dialog-Fenster:", err);
        }
      }

      // 2. Eleganter Speichern-Dialog (funktioniert in jedem Browser & unter file://)
      openSaveModal();
    }

    // Example Dropdown Selection
    exampleSelect.addEventListener("change", function() {
      const selected = exampleSelect.value;
      if (EXAMPLES[selected]) {
        editor.setValue(EXAMPLES[selected]);
        showToast("Beispielcode geladen.");
      }
      exampleSelect.selectedIndex = 0;
    });

    // Output Action: Clear
    btnClearOutput.addEventListener("click", () => {
      clearTerminal();
      execTime.style.display = "none";
      if (placeholder && placeholder.parentNode !== terminal) {
        terminal.appendChild(placeholder);
      }
      showToast("Ausgabe geleert.");
    });

    // Output Action: Copy
    btnCopyOutput.addEventListener("click", async () => {
      const text = terminal.innerText;
      if (!text || (placeholder && placeholder.parentNode === terminal)) {
        showToast("Keine Ausgabe vorhanden.");
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        showToast("Ausgabe in die Zwischenablage kopiert!");
      } catch (err) {
        showToast("Kopieren fehlgeschlagen.");
      }
    });

    // Share Button: Copy shareable link or code snippet
    btnShare.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(editor.getValue());
        showToast("Python-Quellcode in Zwischenablage kopiert!");
      } catch (err) {
        showToast("Kopieren fehlgeschlagen.");
      }
    });

    // Event Listeners for Toolbar Buttons
    btnRun.addEventListener("click", runCode);
    btnNew.addEventListener("click", handleNewFile);
    btnOpen.addEventListener("click", handleOpenFile);
    btnSave.addEventListener("click", saveCodeToFile);

    // Global Keyboard Shortcuts (F5 or Ctrl+Enter)
    window.addEventListener("keydown", (e) => {
      if (e.key === "F5") {
        e.preventDefault();
        runCode();
      }
    });

    // ==========================================================================
    // SPLITTER (RESIZER) DRAG LOGIC
    // ==========================================================================
    const resizer = document.getElementById("resizer");
    const editorPane = document.getElementById("editorPane");
    const workspace = document.getElementById("workspace");

    let isDragging = false;

    resizer.addEventListener("mousedown", (e) => {
      isDragging = true;
      resizer.classList.add("dragging");
      document.body.style.cursor = "col-resize";
      document.body.style.userSelect = "none";
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      const workspaceRect = workspace.getBoundingClientRect();
      let newWidth = e.clientX - workspaceRect.left;

      // Bound between 200px and (workspaceWidth - 200px)
      const minWidth = 220;
      const maxWidth = workspaceRect.width - 220;

      if (newWidth < minWidth) newWidth = minWidth;
      if (newWidth > maxWidth) newWidth = maxWidth;

      editorPane.style.width = `${newWidth}px`;
      if (editor) editor.refresh();
    });

    window.addEventListener("mouseup", () => {
      if (isDragging) {
        isDragging = false;
        resizer.classList.remove("dragging");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
        if (editor) editor.refresh();
      }
    });

    // Touch Support for Resizer
    resizer.addEventListener("touchstart", (e) => {
      isDragging = true;
      resizer.classList.add("dragging");
    }, { passive: true });

    window.addEventListener("touchmove", (e) => {
      if (!isDragging || !e.touches.length) return;
      const touch = e.touches[0];
      const workspaceRect = workspace.getBoundingClientRect();
      let newWidth = touch.clientX - workspaceRect.left;

      const minWidth = 180;
      const maxWidth = workspaceRect.width - 180;

      if (newWidth < minWidth) newWidth = minWidth;
      if (newWidth > maxWidth) newWidth = maxWidth;

      editorPane.style.width = `${newWidth}px`;
      if (editor) editor.refresh();
    }, { passive: true });

    window.addEventListener("touchend", () => {
      if (isDragging) {
        isDragging = false;
        resizer.classList.remove("dragging");
        if (editor) editor.refresh();
      }
    });

    // Start App on DOM Ready
    window.addEventListener("DOMContentLoaded", () => {
      initEditor();
      initPyodide();
    });
  </script>
</body>
</html>
